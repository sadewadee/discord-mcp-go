services:
  discord-mcp:
    container_name: discord-mcp
    # Pulls the published image; `docker compose up --build` builds from source instead.
    image: ghcr.io/sadewadee/discord-mcp-go:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # HTTP authentication (see README): OAuth with "Sign in with Discord"
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      MCP_ALLOWED_USERS: ${MCP_ALLOWED_USERS:-}
      # and/or a fixed bearer token
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      # Without MCP_AUTH_TOKEN or OAuth the server refuses to start, unless this is true
      MCP_INSECURE_NO_AUTH: ${MCP_INSECURE_NO_AUTH:-false}
      # Optional: answer guild mentions of the bot with an LLM (see README)
      # AUTOREPLY_ENABLED: ${AUTOREPLY_ENABLED:-false}
      # AUTOREPLY_LLM_BASE_URL: ${AUTOREPLY_LLM_BASE_URL}
      # AUTOREPLY_LLM_API_KEY: ${AUTOREPLY_LLM_API_KEY}
      # AUTOREPLY_LLM_MODEL: ${AUTOREPLY_LLM_MODEL}
      # AUTOREPLY_SYSTEM_PROMPT: ${AUTOREPLY_SYSTEM_PROMPT:-}
      # AUTOREPLY_CHANNEL_IDS: ${AUTOREPLY_CHANNEL_IDS:-}
    volumes:
      - discord-mcp-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  discord-mcp-data:
